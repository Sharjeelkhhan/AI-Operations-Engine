name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: novadesk
          POSTGRES_PASSWORD: novadesk_password
          POSTGRES_DB: novadesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U novadesk -d novadesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://novadesk:novadesk_password@localhost:5433/novadesk
          REDIS_URL: redis://localhost:6379/0
          API_KEY: dev-api-key
        run: |
          pytest tests/ -q