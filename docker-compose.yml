version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: novadesk_db
    environment:
      POSTGRES_USER: novadesk
      POSTGRES_PASSWORD: novadesk_password
      POSTGRES_DB: novadesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: novadesk_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novadesk_app
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://novadesk:novadesk_password@db:5432/novadesk
      API_KEY: dev-api-key
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  redisdata: